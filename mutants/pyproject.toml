[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "instant-python-metrics"
version = "0.1.0"
description = "Custom API to register usage metrics of instant-python"
authors = [{name = "Diego", email = "dimanu.py@gmail.com"}]
dependencies = [
    "fastapi>=0.136.3",
    "psycopg2-binary>=2.9.12",
    "sqlalchemy>=2.0.50",
    "uuid7>=0.1.0",
    "uvicorn>=0.49.0",
]
requires-python = "==3.13.*"
readme = "README.md"
license = { file = "LICENSE" }

[dependency-groups]
dev = [
    {include-group = "release"},
    {include-group = "lint"},
    {include-group = "test"},
]
release = [
    "python-semantic-release",
]
lint = [
    "mypy",
    "ruff",
    "pip-audit",
    "pre-commit",
]
test = [
    "pytest",
    "mutmut",
    "expects>=0.9.0",
    "doublex>=1.9.6.1",
    "doublex-expects>=0.7.1",
    "httpx>=0.28.1",
    "pytest-cov>=7.1.0",
    "testcontainers>=4.14.2",
]

[tool.mypy]
files = ["src", "test"]
python_version = "3.13"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_unimported = false
disallow_subclassing_any = false
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
enable_error_code = ["ignore-without-code", "redundant-self", "truthy-iterable"]


[tool.pytest.ini_options]
markers = [
    "acceptance: Acceptance tests (full stack end-to-end).",
    "unit: Unit tests (single layer, mocked dependencies).",
    "integration: Integration tests (real adapters).",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
exclude-newer = "3 days"

[tool.mutmut]
source_paths = ["src/usage_events/session.py", "src/usage_events/usage_event_model.py", "src/usage_events/usage_event_repository.py"]
pytest_add_cli_args_test_selection = ["test/"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C4", "UP", "I"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["src", "test"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false


[project.optional-dependencies]
build = ["uv"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_message = "bump: new version {version} created"
commit_parser = "conventional"
major_on_zero = false
allow_zero_version = true
no_git_verify = false
tag_format = "{version}"
build_command = """
    pip install -e '.[build]'
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add uv.lock
    uv build
"""

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "refactor", "test", "build"]
allowed_tags = ["feat", "fix", "refactor", "perf", "build"]
default_bump_level = 0
parse_squash_commits = false
ignore_merge_commits = true

[tool.semantic_release.changelog]
changelog_file = "CHANGELOG.md"
exclude_commit_patterns = ['''^Merge pull request #''', '''^Merge branch ''']
mode = "update"
#template_dir = "docs/changelog"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG"
output_format = "md"
mask_initial_release = false
